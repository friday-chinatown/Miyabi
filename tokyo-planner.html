.btn-primary { background: #e94560; color: #fff; }
.btn-primary:hover { background: #c73652; }
.btn-secondary { background: #2a2a4a; color: #e0e0e0; }
.btn-secondary:hover { background: #3a3a5a; }
.btn-sm { padding: 4px 12px; font-size: 12px; }

.main { display: flex; height: calc(100vh - 140px); }

.calendar-panel { width: 320px; min-width: 320px; background: #1a1a2e; border-right: 1px solid #2a2a4a; overflow-y: auto; padding: 16px; }
.month-header { color: #e94560; font-size: 16px; font-weight: 700; padding: 12px 0 8px; border-bottom: 1px solid #2a2a4a; margin-bottom: 8px; }
.day-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: all 0.15s; margin-bottom: 2px; }
.day-item:hover { background: #2a2a4a; }
.day-item.active { background: #e94560; color: #fff; }
.day-item .date { font-size: 13px; font-weight: 600; min-width: 80px; }
.day-item .area-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #2a2a4a; color: #8892b0; }
.day-item.active .area-tag { background: rgba(255,255,255,0.2); color: #fff; }
.day-item .dow { font-size: 11px; color: #555; min-width: 20px; }
.day-item.active .dow { color: rgba(255,255,255,0.7); }
.day-item.weekend .dow { color: #e94560; }
.day-item.active.weekend .dow { color: #ffb3c1; }

.detail-panel { flex: 1; overflow-y: auto; padding: 24px 32px; }
.detail-title { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.detail-subtitle { font-size: 14px; color: #8892b0; margin-bottom: 20px; }
.detail-area-badge { display: inline-block; padding: 4px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }

.timeline { position: relative; padding-left: 28px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: #2a2a4a; }
.tl-item { position: relative; margin-bottom: 20px; }
.tl-item::before { content: ''; position: absolute; left: -24px; top: 6px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #2a2a4a; background: #1a1a2e; }
.tl-item.meal::before { background: #e94560; border-color: #e94560; }
.tl-item.spot::before { background: #0f3460; border-color: #4a90d9; }
.tl-item.transport::before { background: #2a2a4a; border-color: #555; width: 8px; height: 8px; left: -22px; top: 8px; }

.tl-time { font-size: 12px; color: #e94560; font-weight: 700; margin-bottom: 2px; }
.tl-card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 10px; padding: 14px 18px; }
.tl-card h3 { font-size: 15px; color: #fff; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.tl-card p { font-size: 13px; color: #8892b0; line-height: 1.5; }
.tl-card .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 8px; margin-right: 4px; margin-top: 6px; }
.tag-meal { background: #3d1a2e; color: #e94560; }
.tag-spot { background: #1a2a3d; color: #4a90d9; }
.tag-budget { background: #1a3d2a; color: #4ad97a; }
.tag-transport { background: #2a2a3d; color: #8892b0; }

.meal-card { border-left: 3px solid #e94560; }
.spot-card { border-left: 3px solid #4a90d9; }

.stats-bar { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
.stat { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 10px; padding: 12px 18px; min-width: 120px; }
.stat .label { font-size: 11px; color: #8892b0; text-transform: uppercase; }
.stat .value { font-size: 20px; font-weight: 700; color: #fff; }
.stat .value .unit { font-size: 12px; color: #8892b0; }

.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #555; }
.empty-state .icon { font-size: 64px; margin-bottom: 16px; }
.empty-state p { font-size: 16px; }

.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 4px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; border: 1px solid #2a2a4a; background: transparent; color: #8892b0; transition: all 0.15s; }
.chip.active { background: #e94560; color: #fff; border-color: #e94560; }
.chip:hover { border-color: #e94560; }

@media (max-width: 768px) {
  .main { flex-direction: column; height: auto; }
  .calendar-panel { width: 100%; min-width: 100%; max-height: 300px; }
  .detail-panel { padding: 16px; }
}
</style>

// ===== プラン生成エンジン =====
let plans = [];
let selectedDay = 0;
let activeAreaFilters = new Set();

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

function shuffle(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickN(arr, n, rng) {
  return shuffle(arr, rng).slice(0, n);
}

function pick(arr, rng) {
  return arr[Math.floor(rng() * arr.length)];
}

function generatePlan() {
  const startStr = document.getElementById('startDate').value;
  const style = document.getElementById('travelStyle').value;
  const budget = document.getElementById('budgetLevel').value;
  const startDate = startStr ? new Date(startStr) : new Date();
  const seed = startDate.getTime();
  const rng = seededRandom(seed);

  plans = [];
  const areaIds = Object.keys(SPOTS);

  for (let d = 0; d < 90; d++) {
    const date = new Date(startDate);
    date.setDate(date.getDate() + d);
    const dow = date.getDay();

    // エリアを回転 + 少しランダム性
    const areaIdx = (d + Math.floor(rng() * 3)) % areaIds.length;
    const areaId = areaIds[areaIdx];
    const area = AREAS.find(a => a.id === areaId);
    const spots = SPOTS[areaId] || [];
    const restaurants = RESTAURANTS[areaId] || { breakfast: [], lunch: [], dinner: [] };

    // スタイルに応じたスポット選択
    let selectedSpots = [];
    if (style === 'culture') {
      const cultural = spots.filter(s => ['culture', 'temple'].includes(s.type));
      const others = spots.filter(s => !['culture', 'temple'].includes(s.type));
      selectedSpots = [...pickN(cultural, Math.min(2, cultural.length), rng), ...pickN(others, 1, rng)];
    } else if (style === 'active') {
      const active = spots.filter(s => ['activity', 'walk', 'park'].includes(s.type));
      const others = spots.filter(s => !['activity', 'walk', 'park'].includes(s.type));
      selectedSpots = [...pickN(active, Math.min(2, active.length), rng), ...pickN(others, 1, rng)];
    } else if (style === 'chill') {
      selectedSpots = pickN(spots, 2, rng);
    } else {
      selectedSpots = pickN(spots, Math.min(3, spots.length), rng);
    }

    // 予算フィルタ
    const filterByBudget = (list) => {
      if (budget === 'low') return list.filter(r => !r.budget.includes('10,000') && !r.budget.includes('20,000') && !r.budget.includes('30,000') && !r.budget.includes('40,000'));
      if (budget === 'high') return list.length > 0 ? list : list;
      return list;
    };

    const bfList = filterByBudget(restaurants.breakfast || []);
    const lnList = filterByBudget(restaurants.lunch || []);
    const dnList = filterByBudget(restaurants.dinner || []);

    const bf = bfList.length > 0 ? pick(bfList, rng) : (restaurants.breakfast && restaurants.breakfast.length > 0 ? pick(restaurants.breakfast, rng) : null);
    const ln = lnList.length > 0 ? pick(lnList, rng) : null;
    const dn = dnList.length > 0 ? pick(dnList, rng) : null;

    // タイムライン構築
    const timeline = [];
    const isWeekend = dow === 0 || dow === 6;
    const startHour = isWeekend ? 9 : 8;

    if (bf) {
      timeline.push({
        time: `${String(startHour).padStart(2,'0')}:00`,
        type: 'meal',
        title: `朝食 — ${bf.name}`,
        desc: bf.desc,
        tags: [{ text: bf.genre, cls: 'tag-meal' }, { text: bf.budget, cls: 'tag-budget' }],
        rating: bf.rating,
      });
    }

    let hour = startHour + 1;
    for (const spot of selectedSpots) {
      if (hour >= 11 && hour < 12 && !timeline.find(t => t.title.startsWith('昼食'))) {
        // ランチ挿入
        if (ln) {
          timeline.push({
            time: '11:30',
            type: 'meal',
            title: `昼食 — ${ln.name}`,
            desc: ln.desc,
            tags: [{ text: ln.genre, cls: 'tag-meal' }, { text: ln.budget, cls: 'tag-budget' }],
            rating: ln.rating,
          });
          hour = 13;
        }
      }

      const h = String(hour).padStart(2, '0');
      timeline.push({
        time: `${h}:00`,
        type: 'spot',
        title: spot.name,
        desc: spot.desc,
        tags: [{ text: `${spot.duration}分`, cls: 'tag-spot' }],
      });
      hour += Math.ceil(spot.duration / 60);
    }

    // ランチがまだなら追加
    if (ln && !timeline.find(t => t.title.startsWith('昼食'))) {
      timeline.splice(Math.min(2, timeline.length), 0, {
        time: '12:00',
        type: 'meal',
        title: `昼食 — ${ln.name}`,
        desc: ln.desc,
        tags: [{ text: ln.genre, cls: 'tag-meal' }, { text: ln.budget, cls: 'tag-budget' }],
        rating: ln.rating,
      });
    }

    // グルメ重視の場合、午後にカフェ/軽食追加
    if (style === 'gourmet') {
      const extras = [...(restaurants.lunch || [])].filter(r => r !== ln);
      if (extras.length > 0) {
        const cafe = pick(extras, rng);
        timeline.push({
          time: '15:00',
          type: 'meal',
          title: `午後の寄り道 — ${cafe.name}`,
          desc: cafe.desc,
          tags: [{ text: cafe.genre, cls: 'tag-meal' }, { text: cafe.budget, cls: 'tag-budget' }],
          rating: cafe.rating,
        });
      }
    }

    // ディナー
    if (dn) {
      timeline.push({
        time: isWeekend ? '18:30' : '18:00',
        type: 'meal',
        title: `夕食 — ${dn.name}`,
        desc: dn.desc,
        tags: [{ text: dn.genre, cls: 'tag-meal' }, { text: dn.budget, cls: 'tag-budget' }],
        rating: dn.rating,
      });
    }

    // ソート
    timeline.sort((a, b) => a.time.localeCompare(b.time));

    // 予算概算
    const estimateBudget = (r) => {
      if (!r) return 0;
      const m = r.budget.match(/[\d,]+/);
      return m ? parseInt(m[0].replace(',', '')) : 1000;
    };
    const totalBudget = estimateBudget(bf) + estimateBudget(ln) + estimateBudget(dn) + 1000; // 交通費

    plans.push({
      date,
      area,
      areaId,
      timeline,
      totalBudget,
      spots: selectedSpots.length,
      meals: [bf, ln, dn].filter(Boolean).length,
    });
  }

  return plans;
}

// ===== UI レンダリング =====
function renderCalendar() {
  const panel = document.getElementById('calendarPanel');
  const dowNames = ['日', '月', '火', '水', '木', '金', '土'];
  let html = '';
  let currentMonth = -1;

  for (let i = 0; i < plans.length; i++) {
    const p = plans[i];
    const m = p.date.getMonth();
    const dow = p.date.getDay();
    const isWeekend = dow === 0 || dow === 6;

    // エリアフィルタ
    if (activeAreaFilters.size > 0 && !activeAreaFilters.has(p.areaId)) continue;

    if (m !== currentMonth) {
      currentMonth = m;
      html += `<div class="month-header">${p.date.getFullYear()}年${m + 1}月</div>`;
    }

    const dateStr = `${p.date.getMonth()+1}/${p.date.getDate()}`;
    html += `<div class="day-item ${i === selectedDay ? 'active' : ''} ${isWeekend ? 'weekend' : ''}" onclick="selectDay(${i})">
      <span class="dow">${dowNames[dow]}</span>
      <span class="date">${dateStr}</span>
      <span class="area-tag">${p.area.icon} ${p.area.name}</span>
    </div>`;
  }

  panel.innerHTML = html;
}

function renderDetail() {
  const panel = document.getElementById('detailPanel');
  if (selectedDay < 0 || selectedDay >= plans.length) {
    panel.innerHTML = '<div class="empty-state"><div class="icon">🗺️</div><p>日付を選択してください</p></div>';
    return;
  }

  const p = plans[selectedDay];
  const dowNames = ['日', '月', '火', '水', '木', '金', '土'];
  const dateStr = `${p.date.getFullYear()}年${p.date.getMonth()+1}月${p.date.getDate()}日(${dowNames[p.date.getDay()]})`;

  let html = `
    <div class="detail-title">Day ${selectedDay + 1} — ${dateStr}</div>
    <div class="detail-subtitle">${p.area.icon} ${p.area.name}エリア</div>
    <div class="detail-area-badge" style="background:${p.area.color}22;color:${p.area.color};border:1px solid ${p.area.color}44;">
      ${p.area.icon} ${p.area.name}
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div class="label">スポット</div>
        <div class="value">${p.spots}<span class="unit"> 箇所</span></div>
      </div>
      <div class="stat">
        <div class="label">食事</div>
        <div class="value">${p.meals}<span class="unit"> 食</span></div>
      </div>
      <div class="stat">
        <div class="label">予算目安</div>
        <div class="value">¥${p.totalBudget.toLocaleString()}</div>
      </div>
    </div>

    <div class="timeline">
  `;

  for (const item of p.timeline) {
    const cardClass = item.type === 'meal' ? 'meal-card' : 'spot-card';
    const stars = item.rating ? ` ⭐ ${item.rating}` : '';
    html += `
      <div class="tl-item ${item.type}">
        <div class="tl-time">${item.time}</div>
        <div class="tl-card ${cardClass}">
          <h3>${item.type === 'meal' ? '🍽️' : '📍'} ${item.title}${stars}</h3>
          <p>${item.desc}</p>
          <div>${item.tags.map(t => `<span class="tag ${t.cls}">${t.text}</span>`).join('')}</div>
        </div>
      </div>
    `;
  }

  html += '</div>';
  panel.innerHTML = html;
}

function renderAreaFilter() {
  const container = document.getElementById('areaFilter');
  container.innerHTML = AREAS.map(a =>
    `<span class="chip ${activeAreaFilters.has(a.id) ? 'active' : ''}" onclick="toggleAreaFilter('${a.id}')">${a.icon} ${a.name}</span>`
  ).join('');
}

// ===== イベントハンドラ =====
function generate() {
  generatePlan();
  selectedDay = 0;
  activeAreaFilters.clear();
  renderCalendar();
  renderDetail();
  renderAreaFilter();
}

function selectDay(idx) {
  selectedDay = idx;
  renderCalendar();
  renderDetail();
}

function toggleAreaFilter(id) {
  if (activeAreaFilters.has(id)) activeAreaFilters.delete(id);
  else activeAreaFilters.add(id);
  renderCalendar();
  renderAreaFilter();
}

function exportPlan() {
  if (plans.length === 0) { alert('先にプランを生成してください'); return; }
  const rows = [['日付', '曜日', 'エリア', '時間', '種類', 'タイトル', '説明', '予算']];
  const dowNames = ['日', '月', '火', '水', '木', '金', '土'];

  for (const p of plans) {
    const dateStr = `${p.date.getFullYear()}/${p.date.getMonth()+1}/${p.date.getDate()}`;
    const dow = dowNames[p.date.getDay()];
    for (const item of p.timeline) {
      const budgetTag = item.tags.find(t => t.cls === 'tag-budget');
      rows.push([dateStr, dow, p.area.name, item.time, item.type === 'meal' ? '食事' : '観光', item.title, item.desc, budgetTag ? budgetTag.text : '']);
    }
  }

  const bom = '\uFEFF';
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tokyo-plan-90days.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ===== 初期化 =====
window.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  document.getElementById('startDate').value = today.toISOString().split('T')[0];
  generate();
});
</script>
